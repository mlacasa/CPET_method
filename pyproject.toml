[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpet-functional-skeleton"
version = "0.2.1"
description = "Protocol-aware phase-specific functional representation of breath-by-breath CPET records"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Marcos Lacasa-Cazcarra"},
  {name = "Patricia Launois Obregon"},
  {name = "Alba Gomez Garrido"},
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
tutorial = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/mlacasa/CPET_method"

[tool.setuptools.packages.find]
where = ["src"]
